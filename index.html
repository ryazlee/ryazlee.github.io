    <title>Ryan Lee</title>
    <script>
      try {
        var saved = localStorage.getItem('ryazlee-theme')
        var legacy = localStorage.getItem('darkMode')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            (legacy === 'true' ||
              (legacy !== 'false' &&
                saved !== 'light' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches)))
        if (dark) {
          document.documentElement.classList.add('theme-dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#09090b')
        }
      } catch (e) {}
    </script>
    <script>
      window.goatcounter = { no_onload: true }
    </script>
    <script
      data-goatcounter="https://ryab.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
